<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HPMA Style Apply Preview</title>
    <style>
      @font-face {
        font-family: "HpmaTitle";
        src: url("/assets/hpma-uifont-cn-title.woff") format("woff");
        font-display: swap;
      }

      @font-face {
        font-family: "HpmaNav";
        src: url("/assets/hpma-nav-font.ttf") format("truetype");
        font-display: swap;
      }

      :root {
        --du-bg-2: #221b15;
        --du-bg-1: #30231a;
        --du-text-1: #f4eedc;
        --du-text-2: #d7c39a;
        --du-text-3: #a9854f;
        --du-border-1: #9c742f;
        --du-color-main: #b27b32;
        --du-primary-color: #b27b32;
        --du-primary-solid-bg: #b27b32;
        --hpma-gold: #d8b66a;
        --hpma-gold-bright: #f0d783;
        --hpma-ink: #21170f;
        --hpma-radius-card: 0;
        --hpma-radius-control: 5px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 10%, rgba(240, 215, 131, 0.13), transparent 22%),
          radial-gradient(circle at 78% 32%, rgba(96, 172, 190, 0.14), transparent 18%),
          linear-gradient(135deg, #120d09, #2b1b12 54%, #0d0906);
        color: var(--du-text-1);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      }

      button {
        font: inherit;
      }

      .stage {
        width: min(100vw, 430px);
        padding: 18px;
      }

      .phone {
        position: relative;
        width: min(100%, 375px);
        height: min(812px, calc(100vh - 36px));
        min-height: 680px;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid rgba(240, 215, 131, 0.25);
        border-radius: 34px;
        background:
          radial-gradient(circle at 22% 8%, rgba(240, 215, 131, 0.16), transparent 20%),
          repeating-linear-gradient(45deg, rgba(244, 238, 220, 0.045) 0 1px, transparent 1px 18px),
          linear-gradient(180deg, #1b120d 0%, #120d09 100%);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
      }

      .statusbar {
        position: absolute;
        z-index: 5;
        top: 0;
        left: 0;
        width: 100%;
        height: 59px;
        padding: 14px 26px 0;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        color: var(--du-text-1);
        font-size: 14px;
        font-weight: 700;
        pointer-events: none;
      }

      .island {
        position: absolute;
        top: 11px;
        left: 50%;
        width: 112px;
        height: 33px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: rgba(8, 6, 5, 0.84);
      }

      .icons {
        display: flex;
        gap: 7px;
        align-items: center;
      }

      .signal {
        width: 18px;
        height: 12px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2px;
        align-items: end;
      }

      .signal i {
        display: block;
        border-radius: 2px;
        background: currentColor;
      }

      .signal i:nth-child(1) { height: 4px; opacity: 0.45; }
      .signal i:nth-child(2) { height: 7px; opacity: 0.62; }
      .signal i:nth-child(3) { height: 10px; opacity: 0.8; }
      .signal i:nth-child(4) { height: 12px; }

      .wifi {
        width: 16px;
        height: 12px;
        border: 3px solid currentColor;
        border-right-color: transparent;
        border-bottom-color: transparent;
        border-left-color: transparent;
        border-radius: 16px 16px 0 0;
      }

      .battery {
        width: 24px;
        height: 12px;
        padding: 2px;
        border: 1.8px solid currentColor;
        border-radius: 4px;
      }

      .battery::after {
        content: "";
        position: absolute;
        width: 2px;
        height: 6px;
        margin: 1px 0 0 22px;
        border-radius: 2px;
        background: currentColor;
      }

      .battery i {
        display: block;
        width: 15px;
        height: 100%;
        border-radius: 2px;
        background: currentColor;
      }

      .nav {
        position: absolute;
        z-index: 4;
        top: 59px;
        left: 0;
        right: 0;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        color: var(--du-text-1);
        pointer-events: none;
      }

      .nav-title {
        font-family: "HpmaTitle", serif;
        font-size: 19px;
        font-weight: 400;
        text-shadow: 0 1px 8px rgba(240, 215, 131, 0.28);
      }

      .content {
        height: 100%;
        overflow-y: auto;
        padding: 0 12px 104px;
        scrollbar-width: none;
      }

      .content::-webkit-scrollbar {
        display: none;
      }

      .hero {
        position: relative;
        min-height: 306px;
        margin: 0 -12px 10px;
        padding: 128px 22px 24px;
        display: grid;
        align-content: end;
        overflow: hidden;
        background:
          linear-gradient(180deg, rgba(18, 13, 9, 0.08) 0 36%, rgba(18, 13, 9, 0.92) 88%),
          url("/assets/hpma-bg-home.jpg") center top / cover no-repeat;
        animation: bg-drift 7s ease-in-out infinite alternate;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: auto 0 0;
        height: 60%;
        background: linear-gradient(180deg, transparent, rgba(18, 13, 9, 0.9));
        pointer-events: none;
      }

      .hero-copy {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 7px;
      }

      .hero-copy small {
        color: var(--hpma-gold-bright);
        font-family: "HpmaNav", serif;
        font-size: 11px;
        letter-spacing: 0;
      }

      .hero-copy strong {
        max-width: 270px;
        font-family: "HpmaTitle", serif;
        font-size: 26px;
        font-weight: 400;
        line-height: 1.16;
      }

      .hero-copy span {
        max-width: 300px;
        color: rgba(244, 238, 220, 0.78);
        font-size: 12px;
        line-height: 1.55;
      }

      .ornate-box {
        position: relative;
        display: grid;
        gap: 10px;
        margin-bottom: 8px;
        padding: 15px;
        border: 1px solid rgba(240, 215, 131, 0.56);
        border-radius: var(--hpma-radius-card);
        background:
          linear-gradient(180deg, rgba(59, 40, 27, 0.92), rgba(29, 21, 15, 0.96)),
          var(--du-bg-1);
        color: var(--du-text-1);
        box-shadow: inset 0 0 0 1px rgba(64, 42, 24, 0.72);
      }

      .ornate-box::after {
        content: "";
        position: absolute;
        inset: -1px;
        pointer-events: none;
        background:
          linear-gradient(var(--hpma-gold-bright), var(--hpma-gold-bright)) left top / 30px 1px no-repeat,
          linear-gradient(var(--hpma-gold-bright), var(--hpma-gold-bright)) left top / 1px 30px no-repeat,
          linear-gradient(var(--hpma-gold-bright), var(--hpma-gold-bright)) right top / 30px 1px no-repeat,
          linear-gradient(var(--hpma-gold-bright), var(--hpma-gold-bright)) right top / 1px 30px no-repeat,
          linear-gradient(var(--hpma-gold-bright), var(--hpma-gold-bright)) left bottom / 30px 1px no-repeat,
          linear-gradient(var(--hpma-gold-bright), var(--hpma-gold-bright)) left bottom / 1px 30px no-repeat,
          linear-gradient(var(--hpma-gold-bright), var(--hpma-gold-bright)) right bottom / 30px 1px no-repeat,
          linear-gradient(var(--hpma-gold-bright), var(--hpma-gold-bright)) right bottom / 1px 30px no-repeat;
      }

      .plain-panel {
        display: grid;
        gap: 10px;
        margin-bottom: 8px;
        padding: 12px 0;
        color: var(--du-text-1);
      }

      .tabs {
        display: block;
        padding: 0;
        border-bottom: 1px solid rgba(240, 215, 131, 0.14);
      }

      .tabs .du-tabs__content {
        display: flex;
        align-items: center;
        gap: 22px;
        min-height: 44px;
      }

      .tabs .du-tab-item {
        position: relative;
        min-height: 44px;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: rgba(244, 238, 220, 0.7);
        cursor: pointer;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        font-weight: 760;
        transition: color 180ms ease, text-shadow 180ms ease;
      }

      .tabs .du-tab-item--active {
        color: var(--du-color-main);
        font-weight: 860;
      }

      .tabs .du-tab-item--active::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 3px;
        border-radius: 999px;
        background: currentColor;
      }

      .card small {
        color: var(--hpma-gold-bright);
        font-family: "HpmaNav", serif;
        font-size: 11px;
      }

      .card strong {
        font-family: "HpmaTitle", serif;
        font-size: 21px;
        font-weight: 400;
      }

      .card p {
        margin: 0;
        color: rgba(244, 238, 220, 0.74);
        font-size: 12px;
        line-height: 1.6;
      }

      .meta {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .meta span {
        padding: 8px;
        border: 1px solid rgba(240, 215, 131, 0.28);
        color: rgba(244, 238, 220, 0.78);
        font-size: 11px;
        text-align: center;
      }

      .tab-panel {
        display: none;
      }

      .tab-panel.active {
        display: grid;
      }

      .activity-list,
      .profile-panel {
        gap: 8px;
        margin-bottom: 8px;
      }

      .activity-row,
      .profile-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        min-height: 58px;
        padding: 10px 0;
        border-bottom: 1px solid rgba(240, 215, 131, 0.16);
      }

      .activity-row:last-child,
      .profile-row:last-child {
        border-bottom: 0;
      }

      .activity-row strong,
      .profile-row strong {
        display: block;
        color: var(--du-text-1);
        font-family: "HpmaTitle", serif;
        font-size: 16px;
        font-weight: 400;
        line-height: 1.25;
      }

      .activity-row span,
      .profile-row span {
        display: block;
        margin-top: 3px;
        color: rgba(244, 238, 220, 0.62);
        font-size: 11px;
        line-height: 1.35;
      }

      .activity-row b,
      .profile-row b {
        color: var(--hpma-gold-bright);
        font-family: "HpmaNav", serif;
        font-size: 11px;
        font-weight: 400;
        white-space: nowrap;
      }

      .profile-progress {
        position: relative;
        height: 6px;
        overflow: hidden;
        border-radius: 0;
        background: rgba(240, 215, 131, 0.16);
      }

      .profile-progress i {
        display: block;
        width: 72%;
        height: 100%;
        background: linear-gradient(90deg, var(--du-primary-solid-bg), var(--hpma-gold-bright));
      }

      .actions {
        display: grid;
        grid-template-columns: 1.35fr 1fr;
        gap: 8px;
        padding-top: 4px;
      }

      .actions button {
        min-height: 42px;
        border: 1px solid rgba(240, 215, 131, 0.34);
        border-radius: var(--hpma-radius-control);
        background: rgba(18, 13, 9, 0.42);
        color: rgba(244, 238, 220, 0.8);
        cursor: pointer;
        font-family: "HpmaTitle", serif;
        font-size: 14px;
      }

      .actions .primary {
        background:
          linear-gradient(180deg, rgba(240, 215, 131, 0.28), transparent 42%),
          var(--du-primary-solid-bg);
        color: var(--hpma-ink);
        box-shadow: inset 0 0 0 1px rgba(244, 238, 220, 0.25);
      }

      .tabbar {
        position: absolute;
        z-index: 6;
        right: 0;
        bottom: 34px;
        left: 0;
        height: 48px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: center;
        gap: 8px;
        padding: 4px 14px;
        border-top: 1px solid rgba(240, 215, 131, 0.28);
        background:
          linear-gradient(90deg, transparent, rgba(200, 176, 139, 0.12), transparent),
          rgba(47, 36, 27, 0.96);
      }

      .tabbar button {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        min-height: 40px;
        padding: 7px 8px 6px;
        border: 0;
        background: transparent;
        color: rgba(244, 238, 220, 0.58);
        cursor: pointer;
        font-family: "HpmaNav", serif;
        font-size: 15px;
        font-weight: 850;
        line-height: 1;
        transition: color 180ms ease, text-shadow 180ms ease;
      }

      .tabbar button.active {
        color: var(--hpma-gold-bright);
        font-weight: 900;
        text-shadow: 0 0 14px rgba(240, 215, 131, 0.36);
      }

      .tabbar button:hover {
        color: #f4e0a0;
      }

      .tabbar button::after {
        content: "";
        position: absolute;
        right: 30%;
        bottom: 4px;
        left: 30%;
        height: 8px;
        pointer-events: none;
        background:
          linear-gradient(45deg, transparent 0 35%, currentColor 35% 65%, transparent 65%) left center / 8px 8px no-repeat,
          linear-gradient(90deg, transparent, currentColor, transparent) center / 100% 1px no-repeat;
        opacity: 0;
        transform: translateY(3px);
        transition: opacity 180ms ease, transform 180ms ease, left 180ms ease, right 180ms ease;
      }

      .tabbar button.active::after,
      .tabbar button:hover::after {
        right: 22%;
        left: 22%;
        opacity: 0.76;
        transform: translateY(0);
      }

      .home-indicator {
        position: absolute;
        z-index: 6;
        right: 0;
        bottom: 0;
        left: 0;
        height: 34px;
        display: grid;
        place-items: center;
        background:
          linear-gradient(90deg, transparent, rgba(200, 176, 139, 0.12), transparent),
          rgba(47, 36, 27, 0.96);
      }

      .home-indicator span {
        width: 134px;
        height: 5px;
        border-radius: 999px;
        background: rgba(244, 224, 160, 0.68);
      }

      @keyframes bg-drift {
        from {
          background-position: 0 0, center top;
        }
        to {
          background-position: 0 0, center -10px;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="phone" aria-label="HPMA 独立换肤预览">
        <div class="statusbar" aria-hidden="true">
          <span>9:41</span>
          <span class="island"></span>
          <span class="icons">
            <span class="signal"><i></i><i></i><i></i><i></i></span>
            <span class="wifi"></span>
            <span class="battery"><i></i></span>
          </span>
        </div>
        <header class="nav">
          <span class="nav-title">会员活动中心</span>
        </header>
        <div class="content">
          <section class="hero">
            <div class="hero-copy">
              <small>MEMBER EVENT</small>
              <strong>本周主推活动</strong>
              <span>精选适合本周参与的会员活动，查看报名进度、奖励权益和参与提醒。</span>
            </div>
          </section>
          <nav class="plain-panel tabs du-tabs du-tabs--default" aria-label="业务频道">
            <div class="du-tabs__content">
              <button class="du-tab-item du-tab-item--active" type="button" data-tab="recommend">推荐</button>
              <button class="du-tab-item" type="button" data-tab="activity">活动</button>
              <button class="du-tab-item" type="button" data-tab="profile">资料</button>
            </div>
          </nav>
          <section class="tab-panel active ornate-box card" data-panel="recommend">
            <small>RECOMMEND</small>
            <strong>运营活动报名</strong>
            <p>完成报名后可获得限定权益，活动开始前会通过站内消息提醒你准时参与。</p>
            <div class="meta">
              <span>今日 20:00</span>
              <span>已报名 128</span>
            </div>
          </section>
          <section class="tab-panel plain-panel activity-list" data-panel="activity">
            <article class="activity-row">
              <span><strong>社群任务招募</strong><span>提交报名后可查看审核状态和活动安排。</span></span>
              <b>报名中</b>
            </article>
            <article class="activity-row">
              <span><strong>会员专场直播</strong><span>活动开始前 30 分钟开放提醒和入口。</span></span>
              <b>周五</b>
            </article>
            <article class="activity-row">
              <span><strong>限定权益领取</strong><span>完成任务后在个人中心查看奖励进度。</span></span>
              <b>可领取</b>
            </article>
          </section>
          <section class="tab-panel plain-panel profile-panel" data-panel="profile">
            <div class="profile-row">
              <span><strong>资料完成度</strong><span>补全联系方式和兴趣标签后，推荐会更准确。</span></span>
              <b>72%</b>
            </div>
            <div class="profile-progress" aria-label="资料完成度 72%"><i></i></div>
            <div class="profile-row">
              <span><strong>待补信息</strong><span>所在城市、常用联系方式。</span></span>
              <b>2 项</b>
            </div>
          </section>
          <section class="plain-panel actions" aria-label="页面操作">
            <button id="primary-action" class="primary" type="button">立即参与</button>
            <button id="secondary-action" type="button">查看详情</button>
          </section>
        </div>
        <nav class="tabbar" aria-label="业务底部导航">
          <button class="active" type="button">首页</button>
          <button type="button">活动</button>
          <button type="button">我的</button>
        </nav>
        <div class="home-indicator" aria-hidden="true"><span></span></div>
      </section>
    </main>
    <script>
      const actions = {
        recommend: ["立即参与", "查看详情"],
        activity: ["查看活动", "全部日程"],
        profile: ["完善资料", "稍后再说"],
      };

      document.querySelectorAll(".tabs .du-tab-item").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".tabs .du-tab-item").forEach((item) => item.classList.remove("du-tab-item--active"));
          button.classList.add("du-tab-item--active");
          document.querySelectorAll(".tab-panel").forEach((panel) => {
            panel.classList.toggle("active", panel.dataset.panel === button.dataset.tab);
          });
          document.getElementById("primary-action").textContent = actions[button.dataset.tab][0];
          document.getElementById("secondary-action").textContent = actions[button.dataset.tab][1];
        });
      });

      document.querySelectorAll(".tabbar button").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".tabbar button").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
        });
      });
    </script>
  </body>
</html>
