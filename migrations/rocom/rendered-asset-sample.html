<!doctype html>
<html>
  <head>
    <style>
      .part5-con::before {
        content: "";
        width: calc(25.6 * var(--originRem));
        height: calc(20.1 * var(--originRem));
        background: url(https://game.gtimg.cn/images/rocom/act/a20250812preview/web/part5/20260513/bg.png) 50% 0 / 100% 100% no-repeat;
        position: absolute;
        top: calc(0 * var(--originRem));
        left: 0;
        z-index: 2;
        pointer-events: none;
      }
      .home-hero {
        min-height: 100vh;
        background: url(https://game.gtimg.cn/images/rocom/act/a20250812preview/web/part1/20260513/bg.jpg) 50% 0 / cover no-repeat;
      }
      .home-hero::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 24px;
        background: linear-gradient(90deg, transparent, #fff 18%, #fff 82%, transparent);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main id="mainPage">
      <section class="home-hero p-relative">
        <nav class="home-nav">
          <img class="official-logo" src="https://game.gtimg.cn/images/rocom/web202409/logo.png" alt="洛克王国">
          <a class="download-game" href="javascript:;">下载游戏</a>
        </nav>
        <div class="home-hero-cta">
          <img class="gift-ticket" src="https://game.gtimg.cn/images/rocom/act/a20250812preview/web/part1/icon-gift.png" alt="注册福利">
          <button>扫码下载</button>
          <button>官网 PC 下载</button>
          <button>Android 下载</button>
          <button>App Store</button>
        </div>
      </section>
    </main>
    <section class="part-5 p-relative">
      <i class="part-5-trigger target-trigger"></i>
      <div class="part-5-main-area d-flex flex-column justify-content-center align-items-center" style="transform: scale(0.9);">
        <h3 class="part-5-tit"></h3>
        <div class="part5-con p-relative">
          <div class="part-5-img part-5-img1 active">
            <img id="part-5-img-girl" class="picture-inner" src="//static.gametalk.qq.com/image/467/1782973919_ba1bc92566891e4ed0fc052de99a62ee.png" alt="月刊-女">
          </div>
          <div class="part-5-img part-5-img2">
            <img id="part-5-img-boy" class="picture-inner" src="//static.gametalk.qq.com/image/467/1782973892_26fe3188ad7b204f9c61a6228e7135e6.png" alt="月刊-男">
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
